# ---------------------------------------------------------------------------
# gym-management-app — nginx site config (template)
#
# deploy.sh fills in the {{...}} placeholders and installs this to
# /etc/nginx/conf.d/gym.conf. You normally don't need to edit this file
# directly — it's here so you can see/tweak what deploy.sh sets up.
#
# Layout:
#   /           -> React SPA static build (gym-management-app/dist)
#   /api/...    -> Laravel backend (backend-Gym/public/index.php via PHP-FPM)
# ---------------------------------------------------------------------------
server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 20m;

    root {{FRONTEND_DIST}};
    index index.html;

    # React Router (client-side routing) — unknown paths fall back to
    # index.html so deep links / refreshes on e.g. /membership still work.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Laravel API, mounted at /api — RouteServiceProvider already prefixes
    # routes/api.php with "api", so the original request path (including
    # the /api prefix) must reach Laravel unchanged; that's what
    # fastcgi_param REQUEST_URI $request_uri does below.
    location /api {
        alias {{BACKEND_PUBLIC}};

        # Always execute .php through PHP-FPM — never let nginx serve a
        # .php file as static text (would leak source code).
        location ~ \.php$ {
            fastcgi_pass unix:{{PHP_FPM_SOCK}};
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME {{BACKEND_PUBLIC}}/index.php;
            fastcgi_param REQUEST_URI $request_uri;
        }

        try_files $uri $uri/ @backend;
    }

    location @backend {
        fastcgi_pass unix:{{PHP_FPM_SOCK}};
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME {{BACKEND_PUBLIC}}/index.php;
        fastcgi_param REQUEST_URI $request_uri;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
